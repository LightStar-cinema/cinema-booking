# CineLuxe — docker-compose.yml
# DevOps / Deployment: Hikmatov Dilshodbek (U2310091)
#
# This file starts the ENTIRE CineLuxe system with ONE command:
#   docker-compose up -d
#
# What is Docker Compose?
# It is like a recipe book. Each "service" below is one container
# (a small isolated computer running one job).
# Docker Compose starts all 12 containers in the right order.
#
# Our 12 containers:
#   1.  cinema_postgres        — Main database (stores users, movies, bookings)
#   2.  cinema_redis           — Fast memory store (seat locks, rate limiting)
#   3.  cinema_mongodb         — Document store (daily analytics reports)
#   4.  cinema_rabbitmq        — Message broker (sends booking confirmation events)
#   5.  cinema_api             — FastAPI backend (the brain of the system)
#   6.  cinema_notification_worker — Reads RabbitMQ, simulates sending emails
#   7.  cinema_daily_report    — Runs at midnight, makes daily report in MongoDB
#   8.  cinema_nginx           — The front door — routes all traffic on port 80
#   9.  cinema_otel            — Collects traces, metrics, and logs
#   10. cinema_prometheus      — Stores metrics history
#   11. cinema_loki            — Stores logs
#   12. cinema_grafana         — Dashboard to view all monitoring data
#
# Startup order (Docker waits for health checks):
#   Step 1: Start postgres + redis + mongodb + rabbitmq
#   Step 2: Wait for all 4 to be healthy
#   Step 3: Start api + notification_worker + daily_report_worker
#   Step 4: Start nginx (exposes port 80 to the internet)
#   Step 5: Start observability stack (otel, prometheus, loki, grafana)
#
# Named volumes (data that survives container restarts):
#   postgres_data, redis_data, mongo_data, rabbitmq_data,
#   prometheus_data, loki_data, grafana_data
#
# Network: all containers talk to each other on "cinema_net"
#
# Deployed at: http://138.68.76.246
# GitHub: https://github.com/LightStar-cinema/cinema-booking

networks:
  cinema_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  loki_data:

services:

  # ─── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cinema_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cinema}
      POSTGRES_USER: ${POSTGRES_USER:-cinema_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cinema_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - cinema_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cinema_user} -d ${POSTGRES_DB:-cinema}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cinema_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - cinema_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MongoDB ──────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: cinema_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-mongo_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mongo_pass}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-cinema_logs}
    volumes:
      - mongo_data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d
    ports:
      - "27017:27017"
    networks:
      - cinema_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── RabbitMQ ─────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: cinema_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rabbit_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbit_pass}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-cinema}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI
    networks:
      - cinema_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── FastAPI App (placeholder) ────────────────────────────────
  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: cinema_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cinema_user}:${POSTGRES_PASSWORD:-cinema_pass}@postgres:5432/${POSTGRES_DB:-cinema}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
      MONGO_URL: mongodb://${MONGO_USER:-mongo_user}:${MONGO_PASSWORD:-mongo_pass}@mongodb:27017/${MONGO_DB:-cinema_logs}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-rabbit_user}:${RABBITMQ_PASSWORD:-rabbit_pass}@rabbitmq:5672/${RABBITMQ_VHOST:-cinema}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      # Bind-mount the versions folder so migration files generated inside
      # the container are written directly to the host and survive restarts.
      - ./app/alembic/versions:/app/alembic/versions
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cinema_net

  # ─── OpenTelemetry Collector ──────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    container_name: cinema_otel
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # gRPC
      - "4318:4318"   # HTTP
      - "8889:8889"   # Prometheus metrics scrape
    networks:
      - cinema_net

  # ─── Prometheus ───────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: cinema_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
    networks:
      - cinema_net

  # ─── Loki ─────────────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.5
    container_name: cinema_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - cinema_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Grafana ──────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: cinema_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - cinema_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Notification Worker (RabbitMQ consumer) ─────────────────
  notification_worker:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: cinema_notification_worker
    restart: unless-stopped
    command: ["python", "-m", "workers.notification_worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cinema_user}:${POSTGRES_PASSWORD:-cinema_pass}@postgres:5432/${POSTGRES_DB:-cinema}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
      MONGO_URL: mongodb://${MONGO_USER:-mongo_user}:${MONGO_PASSWORD:-mongo_pass}@mongodb:27017/${MONGO_DB:-cinema_logs}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-rabbit_user}:${RABBITMQ_PASSWORD:-rabbit_pass}@rabbitmq:5672/${RABBITMQ_VHOST:-cinema}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - cinema_net

  # ─── Daily Report Worker (midnight batch job) ─────────────────
  daily_report_worker:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: cinema_daily_report
    restart: unless-stopped
    command: ["python", "-m", "workers.daily_report"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cinema_user}:${POSTGRES_PASSWORD:-cinema_pass}@postgres:5432/${POSTGRES_DB:-cinema}
      MONGO_URL: mongodb://${MONGO_USER:-mongo_user}:${MONGO_PASSWORD:-mongo_pass}@mongodb:27017/${MONGO_DB:-cinema_logs}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - cinema_net

  # ─── Nginx Gateway ────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: cinema_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - cinema_net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
