<head>

<script id="tailwind-config">
tailwind.config = {
  darkMode: "class",
  theme: { extend: {
    colors: {
      "background": "#15121b", "on-background": "#e8dfee",
      "surface": "#15121b", "on-surface": "#e8dfee", "on-surface-variant": "#ccc3d8",
      "primary": "#d2bbff", "primary-container": "#7c3aed", "on-primary": "#3f008e",
      "secondary": "#d3bbff", "outline": "#958da1", "outline-variant": "#4a4455",
      "surface-container": "#221e28", "surface-container-high": "#2c2833",
      "surface-container-highest": "#37333e", "error": "#ffb4ab",
    },
    fontFamily: {
      "body-md": ["Inter"], "label-ui": ["Space Grotesk"],
      "h1-cinematic": ["Inter"], "h2-cinematic": ["Inter"],
      "h3-cinematic": ["Inter"], "label-caps": ["Space Grotesk"],
    },
    fontSize: {
      "label-ui":    ["14px", {"lineHeight":"20px","fontWeight":"500"}],
      "label-caps":  ["12px", {"lineHeight":"16px","letterSpacing":"0.1em","fontWeight":"700"}],
      "h1-cinematic":["48px", {"lineHeight":"56px","letterSpacing":"-0.02em","fontWeight":"700"}],
      "h2-cinematic":["32px", {"lineHeight":"40px","letterSpacing":"-0.02em","fontWeight":"700"}],
      "h3-cinematic":["24px", {"lineHeight":"32px","fontWeight":"600"}],
    },
  }}
}
</script>
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .glass-panel { background: rgba(17,24,39,.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.1); }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #0b1120; }
  ::-webkit-scrollbar-thumb { background: #37333e; border-radius: 10px; }
</style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen">

<!-- ── Nav ─────────────────────────────────────────────────────────────────── -->
<nav class="fixed top-0 w-full border-b border-white/10 bg-slate-950/70 backdrop-blur-xl z-50 shadow-2xl shadow-indigo-500/10">
  <div class="flex justify-between items-center px-8 h-20 max-w-[1440px] mx-auto">
    <a href="/LANDING_PAGE.html" class="text-2xl font-black tracking-tighter bg-gradient-to-r from-indigo-500 to-purple-500 bg-clip-text text-transparent">CINE LUXE</a>
    <div class="hidden md:flex items-center gap-8">
      <a href="/LANDING_PAGE.html" class="text-slate-400 font-medium hover:text-white transition-colors">Movies</a>
      <a href="/CINEMAS.html"      class="text-slate-400 font-medium hover:text-white transition-colors">Cinemas</a>
      <a href="/OFFERS.html"       class="text-slate-400 font-medium hover:text-white transition-colors">Offers</a>
      <a href="/MY_BOOKINGS.html"  class="text-white border-b-2 border-indigo-500 pb-1 font-medium">My Bookings</a>
    </div>
    <div class="flex items-center gap-4" id="nav-right">
      <span class="text-slate-500 text-sm">Loading…</span>
    </div>
  </div>
</nav>

<!-- ── Layout wrapper ────────────────────────────────────────────────────────── -->
<div class="pt-24 flex min-h-screen max-w-[1440px] mx-auto px-8 gap-8">

  <!-- ── Sidebar ──────────────────────────────────────────────────────────── -->
  <aside class="hidden lg:flex flex-col p-6 fixed left-8 top-24 bottom-8 w-56 rounded-3xl border border-white/10 bg-slate-900/80 backdrop-blur-2xl shadow-xl z-40">
    <div class="mb-8">
      <p id="sidebar-name" class="text-white font-bold text-lg truncate">My Account</p>
      <p class="text-slate-500 text-xs mt-1 uppercase tracking-widest">Personal Hub</p>
    </div>
    <nav>
      <span class="flex items-center gap-3 bg-indigo-600/20 text-indigo-400 border-l-4 border-indigo-500 px-4 py-3 rounded-lg font-label-ui text-sm">
        <span class="material-symbols-outlined text-sm">confirmation_number</span>
        My Bookings
      </span>
    </nav>
  </aside>

  <!-- ── Main ─────────────────────────────────────────────────────────────── -->
  <main class="flex-1 lg:ml-64 mb-12">

    <!-- Page header -->
    <header class="mb-10">
      <h1 id="user-greeting" class="font-h1-cinematic text-white text-3xl font-bold">My Bookings</h1>
      <p id="user-subhead" class="text-slate-400 mt-2">Loading your bookings…</p>
    </header>

    <!-- Bookings grid — populated by JS -->
    <div id="bookings-grid" class="space-y-6">
      <!-- Skeleton loader -->
      <div class="glass-panel rounded-3xl overflow-hidden flex h-40 animate-pulse">
        <div class="w-1/3 bg-slate-800"></div>
        <div class="flex-1 p-6 space-y-3">
          <div class="h-5 bg-slate-700 rounded w-1/2"></div>
          <div class="h-3 bg-slate-800 rounded w-1/3"></div>
          <div class="h-3 bg-slate-800 rounded w-2/3 mt-4"></div>
        </div>
      </div>
      <div class="glass-panel rounded-3xl overflow-hidden flex h-40 animate-pulse">
        <div class="w-1/3 bg-slate-800"></div>
        <div class="flex-1 p-6 space-y-3">
          <div class="h-5 bg-slate-700 rounded w-1/2"></div>
          <div class="h-3 bg-slate-800 rounded w-1/3"></div>
          <div class="h-3 bg-slate-800 rounded w-2/3 mt-4"></div>
        </div>
      </div>
    </div>

  </main>
</div>

<!-- ── Footer ───────────────────────────────────────────────────────────────── -->
<footer class="w-full py-12 mt-auto border-t border-white/5 bg-slate-950">
  <div class="flex flex-col items-center justify-center gap-6 px-8 max-w-[1440px] mx-auto">
    <div class="text-xl font-black text-indigo-500 tracking-tighter">CINE LUXE</div>
    <div class="flex flex-wrap justify-center gap-8">
      <a href="#" class="text-slate-600 hover:text-indigo-400 transition-colors text-xs uppercase tracking-widest">Privacy Policy</a>
      <a href="#" class="text-slate-600 hover:text-indigo-400 transition-colors text-xs uppercase tracking-widest">Terms of Service</a>
      <a href="#" class="text-slate-600 hover:text-indigo-400 transition-colors text-xs uppercase tracking-widest">Help Center</a>
      <a href="#" class="text-slate-600 hover:text-indigo-400 transition-colors text-xs uppercase tracking-widest">Contact Us</a>
    </div>
    <p class="text-slate-600 text-xs uppercase tracking-widest">© 2024 CINE LUXE. BEYOND CINEMATIC BOUNDARIES.</p>
  </div>
</footer>

<!-- ── Script ────────────────────────────────────────────────────────────────── -->
<script>
const TOKEN_KEY = 'cinema_token';
const getToken = () => localStorage.getItem(TOKEN_KEY);
const clearToken = () => localStorage.removeItem(TOKEN_KEY);

async function apiFetch(method, path, body) {
  const h = {};
  const tok = getToken();
  if (tok) h['Authorization'] = `Bearer ${tok}`;
  if (body != null) h['Content-Type'] = 'application/json';
  const r = await fetch(path, { method, headers: h, body: body != null ? JSON.stringify(body) : undefined });
  if (r.status === 204) return null;
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.detail || `HTTP ${r.status}`); e.status = r.status; throw e; }
  return d;
}

// ── Status badge ───────────────────────────────────────────────────────────────
function statusBadge(s) {
  const styles = {
    CONFIRMED: 'bg-green-500/20 text-green-400 border-green-500/30',
    PENDING:   'bg-yellow-500/20 text-yellow-400 border-yellow-500/30',
    CANCELLED: 'bg-red-500/20 text-red-400 border-red-500/30',
    EXPIRED:   'bg-slate-500/20 text-slate-400 border-slate-500/30',
  };
  return `<span class="px-2 py-0.5 rounded-lg border text-[10px] font-bold ${styles[s] || styles.EXPIRED}">${s}</span>`;
}

// ── Booking card ───────────────────────────────────────────────────────────────
function makeBookingCard(b) {
  const st    = b.showtime || {};
  const movie = st.movie   || {};
  const scr   = st.screen  || {};
  const seats = (b.seats   || []).map(s => `${s.row}${s.number}`).join(', ');
  const dt    = st.start_time ? new Date(st.start_time) : null;
  const dateStr = dt ? dt.toLocaleDateString([], { weekday:'short', day:'numeric', month:'short', year:'numeric' }) : '—';
  const timeStr = dt ? dt.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }) : '—';
  const canCancel = b.status === 'PENDING' || b.status === 'CONFIRMED';

  const posterHtml = movie.poster_url
    ? `<img src="${movie.poster_url}" alt="${movie.title}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"/>`
    : `<div class="w-full h-full flex items-center justify-center"><span class="material-symbols-outlined text-5xl text-slate-600">movie</span></div>`;

  const div = document.createElement('div');
  div.className = 'glass-panel rounded-3xl overflow-hidden flex flex-col md:flex-row border-white/10 hover:border-indigo-500/40 transition-all duration-500 group';
  div.innerHTML = `
    <div class="md:w-1/4 h-48 md:h-auto relative overflow-hidden bg-slate-800 shrink-0">
      ${posterHtml}
      <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 to-transparent"></div>
      <div class="absolute bottom-3 left-3">${statusBadge(b.status)}</div>
    </div>
    <div class="flex-1 p-6 flex flex-col justify-between relative">
      <!-- Perforated ticket edge -->
      <div class="absolute -left-2 top-0 bottom-0 hidden md:flex flex-col justify-around py-6">
        <div class="w-4 h-4 rounded-full bg-background"></div>
        <div class="w-4 h-4 rounded-full bg-background"></div>
        <div class="w-4 h-4 rounded-full bg-background"></div>
      </div>
      <!-- Movie title + date -->
      <div class="flex justify-between items-start gap-4 mb-4">
        <div>
          <h4 class="text-xl font-bold text-white leading-tight">${movie.title || 'Unknown Movie'}</h4>
          <p class="text-slate-500 text-sm mt-1">${scr.name || '—'}</p>
        </div>
        <div class="text-right shrink-0">
          <div class="text-indigo-400 font-bold text-sm">${dateStr}</div>
          <div class="text-slate-400 text-sm">${timeStr}</div>
        </div>
      </div>
      <!-- Ticket details grid -->
      <div class="grid grid-cols-3 gap-2">
        <div class="bg-white/5 p-2.5 rounded-xl border border-white/5">
          <div class="text-[8px] text-slate-500 uppercase tracking-wider mb-1">Reference</div>
          <div class="text-white text-xs font-bold truncate">${b.booking_reference}</div>
        </div>
        <div class="bg-white/5 p-2.5 rounded-xl border border-white/5">
          <div class="text-[8px] text-slate-500 uppercase tracking-wider mb-1">Seats</div>
          <div class="text-white text-xs font-bold">${seats || '—'}</div>
        </div>
        <div class="bg-white/5 p-2.5 rounded-xl border border-white/5">
          <div class="text-[8px] text-slate-500 uppercase tracking-wider mb-1">Total</div>
          <div class="text-white text-xs font-bold">$${parseFloat(b.total_amount).toFixed(2)}</div>
        </div>
      </div>
      ${canCancel ? `
      <button class="cancel-btn mt-4 text-xs text-red-400 hover:text-red-300 transition-colors flex items-center gap-1 w-fit"
              data-id="${b.id}">
        <span class="material-symbols-outlined text-xs">cancel</span> Cancel Booking
      </button>` : ''}
    </div>`;

  div.querySelector('.cancel-btn')?.addEventListener('click', async () => {
    if (!confirm('Cancel this booking? This cannot be undone.')) return;
    try {
      await apiFetch('POST', `/api/bookings/${b.id}/cancel`);
      loadBookings();
    } catch(e) { alert(`Cancel failed: ${e.message}`); }
  });

  return div;
}

// ── Empty state ────────────────────────────────────────────────────────────────
function emptyState() {
  const div = document.createElement('div');
  div.className = 'text-center py-20';
  div.innerHTML = `
    <span class="material-symbols-outlined text-6xl text-slate-700 block mb-4">confirmation_number</span>
    <h3 class="text-white text-xl font-bold mb-2">No bookings yet</h3>
    <p class="text-slate-400 mb-8 text-sm">Start your cinematic journey and book your first ticket.</p>
    <a href="/LANDING_PAGE.html"
       class="inline-flex items-center gap-2 px-8 py-3 rounded-xl text-white font-bold text-sm transition-all hover:opacity-90"
       style="background:linear-gradient(to right,#4f46e5,#7c3aed)">
      <span class="material-symbols-outlined text-sm">movie</span> Browse Movies
    </a>`;
  return div;
}

// ── Load bookings ──────────────────────────────────────────────────────────────
async function loadBookings() {
  if (!getToken()) { location.href = '/LANDING_PAGE.html'; return; }

  // Auth + sidebar name
  let user = null;
  try {
    user = await apiFetch('GET', '/api/auth/me');
    if (!user) { clearToken(); location.href = '/LANDING_PAGE.html'; return; }

    document.getElementById('user-greeting').textContent = `Welcome back, ${user.full_name.split(' ')[0]}.`;
    document.getElementById('sidebar-name').textContent = user.full_name;

    // Nav-right: show name + logout
    const navRight = document.getElementById('nav-right');
    if (navRight) {
      navRight.innerHTML = `
        <span class="text-slate-300 text-sm hidden md:block">${user.full_name.split(' ')[0]}</span>
        <button id="nav-logout" class="text-xs text-slate-400 hover:text-red-400 transition-colors">Logout</button>`;
      document.getElementById('nav-logout').addEventListener('click', () => {
        clearToken(); location.href = '/LANDING_PAGE.html';
      });
    }
  } catch(e) {
    if (e.status === 401) { clearToken(); location.href = '/LANDING_PAGE.html'; return; }
  }

  const grid = document.getElementById('bookings-grid');
  grid.innerHTML = '';

  try {
    const bookings = await apiFetch('GET', '/api/bookings/me?limit=20');

    const active = bookings.filter(b => b.status !== 'CANCELLED' && b.status !== 'EXPIRED');
    document.getElementById('user-subhead').textContent =
      active.length
        ? `You have ${active.length} active booking${active.length !== 1 ? 's' : ''}.`
        : 'No upcoming bookings.';

    if (!bookings.length) {
      grid.appendChild(emptyState());
      return;
    }

    // Sort: CONFIRMED first, then PENDING, then CANCELLED/EXPIRED
    bookings.sort((a, z) => {
      const ord = { CONFIRMED: 0, PENDING: 1, CANCELLED: 2, EXPIRED: 3 };
      return (ord[a.status] ?? 4) - (ord[z.status] ?? 4);
    });

    bookings.forEach(b => grid.appendChild(makeBookingCard(b)));
  } catch(e) {
    grid.innerHTML = `
      <div class="text-center py-12">
        <span class="material-symbols-outlined text-4xl text-red-400 block mb-2">error</span>
        <p class="text-red-400 text-sm">${e.message}</p>
      </div>`;
  }
}

// ── Admin nav ─────────────────────────────────────────────────────────────────
async function checkAdminNav() {
  if (!getToken()) return;
  try {
    const u = await apiFetch('GET', '/api/auth/me');
    if (!u?.is_admin) return;
    const navLinks = document.querySelector('nav .hidden.md\\:flex');
    if (navLinks && !navLinks.querySelector('[href="/ADMIN.html"]')) {
      const a = document.createElement('a');
      a.href = '/ADMIN.html';
      a.className = 'text-indigo-400 font-bold hover:text-indigo-300 transition-colors text-sm';
      a.textContent = 'Admin';
      navLinks.appendChild(a);
    }
  } catch(e) {}
}

// ── Boot ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  loadBookings();
  checkAdminNav();
});
</script>
</body>
</html>
