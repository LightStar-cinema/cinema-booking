
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    upstream api {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        # Frontend static files
        root /usr/share/nginx/html;
        index LANDING_PAGE.html;

        # REST API
        location /api/ {
            proxy_pass         http://api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # WebSocket endpoint
        location /ws/ {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
        }

        # Health check
        location /health {
            proxy_pass http://api/health;
        }

        # Static assets — explicit block so they are never proxied to the API
        # or caught by the SPA fallback and returned as HTML
        location /images/ {
            try_files $uri =404;
        }

        # Serve frontend — catch-all after API/WS locations
        location / {
            try_files $uri $uri.html $uri/ /LANDING_PAGE.html;
        }
    }
}
