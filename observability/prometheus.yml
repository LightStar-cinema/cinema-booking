# ============================================================
# CineLuxe — observability/prometheus.yml
# DevOps / Deployment: Hikmatov Dilshodbek (U2310091)
#
# What is Prometheus?
#   Prometheus is a metrics database. It "scrapes" (pulls)
#   numbers from our services every few seconds and stores them.
#   Example metrics: requests/sec, error rate, booking count.
#
# What does this file configure?
#   - Scrape interval: how often Prometheus collects data
#   - Targets: which containers to collect metrics FROM
#     * otel-collector:8889  → receives metrics from FastAPI via OTLP
#
# Flow:
#   FastAPI → OTLP → otel-collector → Prometheus → Grafana dashboard
#
# Container name: cinema_prometheus
# Data stored in: prometheus_data (Docker named volume)
# UI available at: http://localhost:9090
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: cinema-local

scrape_configs:
  # otel-collector exposes all OTLP metrics in Prometheus format on :8889
  - job_name: cinema_api
    static_configs:
      - targets: ["otel-collector:8889"]
    metrics_path: /metrics

  # Scrape Prometheus's own process metrics
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
