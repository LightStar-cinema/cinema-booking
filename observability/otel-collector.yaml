# ============================================================
# CineLuxe — observability/otel-collector.yaml
# DevOps / Deployment: Hikmatov Dilshodbek (U2310091)
#
# What is the OpenTelemetry Collector?
#   It is the CENTRAL HUB for all observability signals.
#   The API sends traces, metrics, and logs to this ONE place,
#   and the collector forwards them to the right destinations.
#
# Pipelines configured:
#   Traces  → stdout (logged for debugging)
#   Metrics → Prometheus (scraped on port 8889)
#   Logs    → Loki (pushed via HTTP)
#
# Why use a collector instead of direct export?
#   - API only needs ONE connection (to otel-collector)
#   - Easy to add new destinations without changing app code
#   - Batching and retry logic built-in
#
# Container name: cinema_otel
# Receives on: OTLP gRPC port 4317, HTTP port 4318
# ============================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1000
  # Promote resource attributes to Loki stream labels
  resource:
    attributes:
      - action: insert
        key: loki.resource.labels
        value: service.name, service.version

exporters:
  # ── Traces → stdout (swap for otlp/tempo when Tempo is added) ─────────────
  debug:
    verbosity: normal

  # ── Metrics → Prometheus scrape endpoint ──────────────────────────────────
  prometheus:
    endpoint: "0.0.0.0:8889"
    resource_to_telemetry_conversion:
      enabled: true     # promotes resource attributes to Prometheus labels

  # ── Logs → Loki push API ──────────────────────────────────────────────────
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    default_labels_enabled:
      exporter: false
      job: true    # set from service.name resource attribute
      level: true  # set from log severity

service:
  telemetry:
    logs:
      level: "warn"

  pipelines:
    traces:
      receivers:  [otlp]
      processors: [batch]
      exporters:  [debug]

    metrics:
      receivers:  [otlp]
      processors: [batch]
      exporters:  [prometheus]

    logs:
      receivers:  [otlp]
      processors: [resource, batch]
      exporters:  [loki]
