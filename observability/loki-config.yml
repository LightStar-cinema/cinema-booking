# ============================================================
# CineLuxe — observability/loki-config.yml
# DevOps / Deployment: Hikmatov Dilshodbek (U2310091)
#
# What is Loki?
#   Loki is a log storage system by Grafana Labs.
#   It stores application logs (like a searchable log file).
#
# What does this file configure?
#   - Single-node mode (no clustering needed for university project)
#   - Storage path for log chunks and indexes
#   - Retention and ingestion limits
#
# Flow:
#   FastAPI logs → OTLP → otel-collector → Loki → Grafana
#
# Container name: cinema_loki
# Data stored in: loki_data (Docker named volume)
# Grafana queries Loki using label: {job="cinema-api"}
# ============================================================

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h

analytics:
  reporting_enabled: false
