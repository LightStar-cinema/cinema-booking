#
# What is RabbitMQ?
#   RabbitMQ is a message broker — it passes events between
#   services so they don't need to call each other directly.
#
# How CineLuxe uses it:
#   1. User pays for booking → FastAPI publishes "booking_confirmed" event
#   2. RabbitMQ holds the message in a queue
#   3. notification_worker reads the queue → simulates sending email
#
# Why message queue instead of direct call?
#   - If notification service is down, message waits (not lost)
#   - FastAPI doesn't wait for email to send (faster response)
#   - Decoupled architecture
#
# Container name: cinema_rabbitmq
# Data stored in: rabbitmq_data (Docker named volume)
# Management UI: http://localhost:15672
# Virtual host: cinema
# ============================================================

# RabbitMQ configuration
log.console = true
log.console.level = info
management.tcp.port = 15672
